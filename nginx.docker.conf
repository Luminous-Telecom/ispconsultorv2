# Nginx para Docker (dev): proxy para backend e frontend rodando no host.
# host.docker.internal = máquina host (extra_hosts no compose); resolvido via /etc/hosts.
server_tokens off;

upstream backend {
    server host.docker.internal:3001;
}

upstream frontend {
    server host.docker.internal:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    client_max_body_size 100M;

    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location /api {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /webhook {
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    location /boleto {
        proxy_pass http://backend;
    }

    location /arquivos/ {
        proxy_pass http://backend;
    }

    location /uploads {
        proxy_pass http://backend;
    }

    location ~ ^/(health|client-ip) {
        proxy_pass http://backend;
    }

    location ~ ^/(wp-admin|wp-login|phpmyadmin|pma|\.env|\.git) {
        return 404;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
