name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Criar nova release mesmo sem commits novos'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Versionar e criar release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_BEFORE: ${{ github.event.before }}
          RELEASE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node <<'ENDSCRIPT'
const { execSync } = require('child_process');
const fs = require('fs');

const PKG_PATH = 'backend/package.json';
const ZERO_SHA = '0000000000000000000000000000000000000000';

function sh(command) {
  return execSync(command, { encoding: 'utf8' }).trim();
}

function trySh(command) {
  try {
    return sh(command);
  } catch {
    return '';
  }
}

function parseSemver(value) {
  const parts = String(value || '0.0.0').replace(/^v/i, '').split('-')[0].split('.');
  return [0, 1, 2].map((index) => parseInt(parts[index], 10) || 0);
}

function compareSemver(left, right) {
  const a = parseSemver(left);
  const b = parseSemver(right);
  for (let index = 0; index < 3; index += 1) {
    if (a[index] !== b[index]) return a[index] - b[index];
  }
  return 0;
}

function bump(version, type) {
  const [major, minor, patch] = parseSemver(version);
  if (type === 'major') return `${major + 1}.0.0`;
  if (type === 'minor') return `${major}.${minor + 1}.0`;
  return `${major}.${minor}.${patch + 1}`;
}

function formatCommitSubject(subject) {
  const trimmed = subject.trim();
  const conventional = trimmed.match(/^(\w+)(?:\(([^)]+)\))?(!)?:\s*(.+)$/);
  if (conventional) {
    const category = (conventional[2] || 'Geral')
      .split(/[-_/]/)
      .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
      .join(' ');
    const description = conventional[4].charAt(0).toUpperCase() + conventional[4].slice(1);
    return `- ${category}: ${description}`;
  }
  const text = trimmed;
  return `- Geral: ${text ? text.charAt(0).toUpperCase() + text.slice(1) : 'Atualização do sistema'}`;
}

function incrementType(subjects) {
  let type = 'patch';
  for (const subject of subjects) {
    const lower = subject.toLowerCase();
    if (lower.includes('breaking') || /^major[:! ]/.test(lower) || /^\w+(\([^)]*\))?!:/.test(lower)) {
      return 'major';
    }
    if (/^(feat|feature|add|new)(\([^)]*\))?[: ]/.test(lower)) type = 'minor';
  }
  return type;
}

function latestTag() {
  const tags = sh("git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname");
  return tags.split('\n').map((tag) => tag.trim()).filter(Boolean)[0] || '';
}

function tagVersion(tag) {
  return tag.replace(/^v/i, '').split('-')[0];
}

function readPackageVersion() {
  return JSON.parse(fs.readFileSync(PKG_PATH, 'utf8')).version.split('-')[0];
}

function writePackageVersion(version) {
  const raw = fs.readFileSync(PKG_PATH, 'utf8');
  const next = raw.replace(/"version":\s*"[^"]+"/, `"version": "${version}"`);
  if (next === raw) throw new Error('Campo version não encontrado em backend/package.json');
  fs.writeFileSync(PKG_PATH, next);
}

function subjectsInRange(range) {
  const log = sh(`git log ${range} --pretty=format:%s`);
  return log.split('\n').map((line) => line.trim()).filter((line) => line && !line.startsWith('chore(release):'));
}

function subjectsSince(tag) {
  if (tag) return subjectsInRange(`${tag}..HEAD`);
  if (process.env.GITHUB_BEFORE && process.env.GITHUB_BEFORE !== ZERO_SHA) {
    return subjectsInRange(`${process.env.GITHUB_BEFORE}..HEAD`);
  }
  return subjectsInRange('-1');
}

function releaseBody(subjects) {
  const lines = (subjects.length > 0 ? subjects : ['Atualização do sistema']).map(formatCommitSubject);
  const meta = sh('git log -1 --pretty=format:%h%x09%an%x09%ai');
  const [hash, author, date] = meta.split('\t');
  return `${lines.join('\n')}\n\n---\nCommit: ${hash} | Autor: ${author} | Data: ${date}\n`;
}

function githubHeaders() {
  return {
    Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
    Accept: 'application/vnd.github+json',
    'User-Agent': 'isp-consultor-release',
    'X-GitHub-Api-Version': '2022-11-28',
  };
}

async function releaseExists(tag) {
  const response = await fetch(`https://api.github.com/repos/${process.env.GH_REPO}/releases/tags/${encodeURIComponent(tag)}`, {
    headers: githubHeaders(),
  });
  return response.status === 200;
}

async function createRelease(tag, body) {
  const response = await fetch(`https://api.github.com/repos/${process.env.GH_REPO}/releases`, {
    method: 'POST',
    headers: { ...githubHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({
      tag_name: tag,
      name: `Release ${tag}`,
      body,
      draft: false,
      prerelease: false,
      target_commitish: sh('git rev-parse HEAD'),
    }),
  });
  const raw = await response.text();
  if (response.status === 201) {
    console.log(`Release criada: ${JSON.parse(raw).html_url}`);
    return;
  }
  if (response.status === 422) {
    console.log(`Release ou tag já existe: ${raw}`);
    return;
  }
  throw new Error(`Falha ao criar release (${response.status}): ${raw}`);
}

function baseVersion(tag) {
  const fromPackage = readPackageVersion();
  if (!tag) return fromPackage;
  const fromTag = tagVersion(tag);
  return compareSemver(fromTag, fromPackage) > 0 ? fromTag : fromPackage;
}

function containingReleaseTag(commit) {
  const tags = sh(`git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --contains ${commit} --sort=-v:refname`);
  return tags.split('\n').map((item) => item.trim()).filter(Boolean)[0] || '';
}

async function main() {
  sh('git fetch origin main --tags --force');
  const head = sh('git rev-parse HEAD');
  const existingTag = containingReleaseTag(head);

  if (existingTag && process.env.RELEASE_FORCE !== 'true') {
    if (await releaseExists(existingTag)) {
      console.log(`Commit ${head.slice(0, 7)} já está na release ${existingTag}.`);
      return;
    }
    const previous = trySh(`git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' ${existingTag}^`);
    const subjects = previous ? subjectsInRange(`${previous}..${existingTag}`) : [];
    await createRelease(existingTag, releaseBody(subjects));
    return;
  }

  const tag = latestTag();
  const subjects = subjectsSince(tag);
  if (subjects.length === 0 && process.env.RELEASE_FORCE !== 'true') {
    console.log('Nenhum commit novo desde a última release.');
    return;
  }

  const version = bump(baseVersion(tag), incrementType(subjects));
  const tagName = `v${version}`;
  console.log(`Versão: ${baseVersion(tag)} → ${version} (${incrementType(subjects)})`);
  writePackageVersion(version);

  const body = releaseBody(subjects);
  sh('git config user.name "github-actions[bot]"');
  sh('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
  sh(`git add ${PKG_PATH}`);
  sh(`git commit -m "chore(release): ${tagName}"`);

  try {
    sh('git push origin HEAD:main');
  } catch (error) {
    console.log('Push rejeitado; rebase em origin/main e nova tentativa.');
    sh('git fetch origin main --tags --force');
    sh('git rebase origin/main');
    sh('git push origin HEAD:main');
  }

  sh(`git tag -a ${tagName} -m "Release ${tagName}"`);
  sh(`git push origin ${tagName}`);
  await createRelease(tagName, body);
}

main().catch((error) => {
  console.error(error instanceof Error ? error.message : error);
  process.exit(1);
});
ENDSCRIPT
