name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Criar nova release mesmo sem commits novos'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Versionar e criar release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_BEFORE: ${{ github.event.before }}
          RELEASE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node .github/scripts/create-release.js
