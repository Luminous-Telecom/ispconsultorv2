name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Compilar no runner
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          npm ci --no-audit --no-fund --prefer-offline

          echo "=== Buildando frontend ==="
          npm ci --prefix frontend --no-audit --no-fund --prefer-offline
          npm run build --prefix frontend
          [ -f "frontend/build/index.html" ] || { echo "ERRO: frontend build falhou!"; exit 1; }
          echo "✓ Frontend buildado"

          echo "=== Buildando backend ==="
          npm ci --prefix backend --no-audit --no-fund --prefer-offline
          npm run build --prefix backend
          [ -d "backend/dist" ] || { echo "ERRO: backend build falhou!"; exit 1; }
          echo "✓ Backend buildado"
