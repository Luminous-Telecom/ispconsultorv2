name: Deploy para Produção

# 1. Quando o fluxo de trabalho deve ser executado
on:
  push:
    branches:
      # Aciona o deploy sempre que houver um push na branch 'main'
      - main

# 2. Define o Job (Trabalho) de Deploy
jobs:
  deploy:
    runs-on: ubuntu-latest # O ambiente onde o código será executado

    steps:
      # Faz o checkout do código
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        
      # Configura o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajuste a versão do Node conforme necessário

      # Instala as dependências e executa o build
      - name: Instalar Dependências e Buildar Projeto
        run: |
          npm install
          npm ci --prefix backend
          npm ci --prefix frontend
          npm run build --prefix backend
          npm run build --prefix frontend
      
      # === 3. O Passo de Deployment ===
      
      - name: Criar Pasta de Deploy e Configurar Git
        run: |
          # 1. Cria a pasta temporária de deploy
          mkdir -p deployment/backend deployment/frontend
          
          # 2. Copia os artefatos gerados para a pasta temporária
          # Backend: dist, package.json e env.example
          cp -r backend/dist deployment/backend/dist
          cp backend/package.json deployment/backend/package.json
          cp backend/env.example deployment/backend/env.example
          
          # Frontend: build, public, package.json, env.example e server.js
          cp -r frontend/build deployment/frontend/build
          cp -r frontend/public deployment/frontend/public
          cp frontend/package.json deployment/frontend/package.json
          cp frontend/env.example deployment/frontend/env.example
          cp frontend/server.js deployment/frontend/server.js
          
          # 3. Configura o usuário Git para o push
          git config --global user.name "GitHub Actions Deploy"
          git config --global user.email "actions@github.com"
      
      # Faz o push da pasta de deploy para o repositório de produção usando Git diretamente
      - name: Enviar Build para Repositório de Produção
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
        run: |
          cd deployment
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add origin https://${GITHUB_TOKEN}@github.com/Luminous-Telecom/backnet.prod.git
          git add .
          git commit -m "Deploy automático - $(date +'%Y-%m-%d %H:%M:%S')"
          git branch -M main
          git push -f origin main
          
      - name: Limpar pastas de build
        run: |
          rm -rf deployment
          rm -rf backend/dist
          rm -rf frontend/build