name: Deploy para Produção

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_full_build:
        description: "Forçar build de backend+frontend e nova release (use quando commits ficaram só em paths que não disparavam build)"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Runtime das actions (checkout/setup-node); build da app usa node-version abaixo.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ─────────────────────────────────────────────────────────────
      # 1. Detectar o que mudou
      # ─────────────────────────────────────────────────────────────
      - name: Verificar Alterações
        id: changes
        run: |
          PREV_COMMIT="${{ github.event.before }}"
          CURRENT_COMMIT="${{ github.sha }}"

          if [ -z "${PREV_COMMIT}" ] || [ "${PREV_COMMIT}" == "0000000000000000000000000000000000000000" ]; then
            PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi

          if [ -z "${PREV_COMMIT}" ] || [ "${PREV_COMMIT}" == "${CURRENT_COMMIT}" ]; then
            echo "Primeiro commit — buildando tudo"
            echo "backend_changed=true"  >> $GITHUB_OUTPUT
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "workflows_changed=true" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --name-only "${PREV_COMMIT}" "${CURRENT_COMMIT}" || echo "")
            echo "Arquivos alterados:" && echo "${CHANGED_FILES}"

            echo "${CHANGED_FILES}" | grep -qE '^backend/'  && echo "backend_changed=true"  >> $GITHUB_OUTPUT || echo "backend_changed=false"  >> $GITHUB_OUTPUT
            echo "${CHANGED_FILES}" | grep -qE '^frontend/' && echo "frontend_changed=true" >> $GITHUB_OUTPUT || echo "frontend_changed=false" >> $GITHUB_OUTPUT
            # Workflow de deploy / infra na raiz também exige build + Release
            echo "${CHANGED_FILES}" | grep -qE '^\.github/workflows/|^scripts/|^ecosystem\.config\.js|^package\.json$' \
              && echo "workflows_changed=true" >> $GITHUB_OUTPUT || echo "workflows_changed=false" >> $GITHUB_OUTPUT
          fi

          # Último valor no GITHUB_OUTPUT vence — sobrescreve detecção por arquivo.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.force_full_build }}" == "true" ]; then
            echo "::notice::workflow_dispatch: forçando build completo (backend + frontend + release)."
            echo "backend_changed=true"  >> $GITHUB_OUTPUT
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "workflows_changed=true" >> $GITHUB_OUTPUT
          fi

          echo "prev_commit=${PREV_COMMIT}"       >> $GITHUB_OUTPUT
          echo "current_commit=${CURRENT_COMMIT}" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────────────────────
      # 2. Instalar, versionar e buildar
      # ─────────────────────────────────────────────────────────────
      - name: Instalar Dependências e Buildar Projeto
        run: |
          npm install

          # Determinar se precisa buildar
          if [ "${{ steps.changes.outputs.backend_changed }}"  == "true" ] || \
             [ "${{ steps.changes.outputs.frontend_changed }}" == "true" ] || \
             [ "${{ steps.changes.outputs.workflows_changed }}" == "true" ]; then
            SHOULD_BUILD=true
          else
            SHOULD_BUILD=false
            echo "Nenhuma mudança em backend, frontend, workflows ou infra — build pulado"
          fi

          if [ "${SHOULD_BUILD}" == "true" ]; then
            # ── Frontend ──────────────────────────────────────────
            echo "=== Buildando frontend ==="
            npm ci --prefix frontend
            npm run build --prefix frontend
            [ -f "frontend/build/index.html" ] || { echo "ERRO: frontend build falhou!"; exit 1; }
            echo "✓ Frontend buildado"

            # ── Versioning ────────────────────────────────────────
            echo "=== Incrementando versão ==="
            GITHUB_REPO_PROD="Luminous-Telecom/backnet.prod"
            GITHUB_TOKEN_PROD="${{ secrets.PROD_PAT }}"

            LAST_TAG_RESPONSE=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN_PROD}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPO_PROD}/tags?per_page=1" || echo "[]")

            LAST_TAG=$(echo "${LAST_TAG_RESPONSE}" | node -e "
              try {
                const tags = JSON.parse(require('fs').readFileSync(0,'utf-8'));
                if (Array.isArray(tags) && tags[0]?.name) console.log(tags[0].name);
              } catch {}
            " 2>/dev/null || echo "")

            if [ -n "${LAST_TAG}" ] && [ "${LAST_TAG}" != "null" ]; then
              OLD_VERSION=$(echo "${LAST_TAG}" | sed 's/^v//' | sed 's/-.*//')
            else
              OLD_VERSION=$(node -p "require('./backend/package.json').version.split('-')[0]")
            fi
            echo "Versão atual: ${OLD_VERSION}"

            PREV_COMMIT="${{ steps.changes.outputs.prev_commit }}"
            CURRENT_COMMIT="${{ steps.changes.outputs.current_commit }}"
            if [ "${PREV_COMMIT}" == "${CURRENT_COMMIT}" ] || \
               [ "${PREV_COMMIT}" == "0000000000000000000000000000000000000000" ]; then
              COMMIT_RANGE="-1"
            else
              COMMIT_RANGE="${PREV_COMMIT}..${CURRENT_COMMIT}"
            fi

            COMMITS=$(git log ${COMMIT_RANGE} --pretty=format:"%s" 2>/dev/null || echo "")
            INCREMENT_TYPE="patch"
            while IFS= read -r commit; do
              LOWER=$(echo "${commit}" | tr '[:upper:]' '[:lower:]')
              echo "${LOWER}" | grep -qE "(breaking|^major:?[ !])" && INCREMENT_TYPE="major" && break
              echo "${LOWER}" | grep -qE "^(feat|feature|add|new)[: ]" && INCREMENT_TYPE="minor"
            done <<< "${COMMITS}"
            # Nunca usar "none": range git vazio ou squash gerava mesma versão → tag/release duplicadas.
            if [ -z "${COMMITS}" ]; then
              echo "::notice::Range git sem commits visíveis — mantendo incremento (${INCREMENT_TYPE})."
            fi

            # Garantir package.json >= última tag do prod antes do bump (evita colisão vX já existente)
            node -e "
              const fs = require('fs');
              const p = 'backend/package.json';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              const tag = '${OLD_VERSION}'.trim();
              const cur = (j.version || '0.0.0').split('-')[0];
              const pa = tag.split('.').map((n) => parseInt(n, 10) || 0);
              const pb = cur.split('.').map((n) => parseInt(n, 10) || 0);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const a = pa[i] || 0, b = pb[i] || 0;
                if (a > b) {
                  j.version = tag;
                  fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
                  console.log('package.json alinhado à tag prod:', cur, '->', tag);
                  process.exit(0);
                }
                if (b > a) process.exit(0);
              }
              process.exit(0);
            " || true

            if [ "${INCREMENT_TYPE}" != "none" ]; then
              # npm version atualiza o package.json e imprime a nova versão
              VERSION=$(cd backend && npm version ${INCREMENT_TYPE} --no-git-tag-version | sed 's/^v//')
              echo "✓ Versão: ${OLD_VERSION} → ${VERSION}"
            else
              VERSION="${OLD_VERSION}"
              echo "✓ Versão mantida: ${VERSION}"
            fi

            echo "VERSION=${VERSION}"         >> $GITHUB_ENV
            echo "OLD_VERSION=${OLD_VERSION}" >> $GITHUB_ENV

            # ── Backend ───────────────────────────────────────────
            echo "=== Buildando backend ==="
            npm ci --prefix backend
            npm run build --prefix backend
            [ -d "backend/dist" ] || { echo "ERRO: backend build falhou!"; exit 1; }
            echo "✓ Backend buildado"

            echo "BUILD_EXECUTED=true" >> $GITHUB_ENV
          else
            echo "BUILD_EXECUTED=false" >> $GITHUB_ENV
          fi

      # GITHUB_ENV nem sempre é avaliado de forma fiável em `if:` do próximo step; expomos outputs explícitos.
      - name: Metadados do build (Release)
        id: build_meta
        run: |
          echo "build_executed=${BUILD_EXECUTED:-false}" >> $GITHUB_OUTPUT
          echo "version=${VERSION:-}" >> $GITHUB_OUTPUT
          echo "::notice::BUILD_EXECUTED=${BUILD_EXECUTED:-<vazio>} VERSION=${VERSION:-<vazio>}"

      # ─────────────────────────────────────────────────────────────
      # 3. Informações do commit (para mensagem de deploy)
      # ─────────────────────────────────────────────────────────────
      - name: Obter Informações do Commit
        id: commit_info
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
        run: |
          echo "hash=$(git rev-parse --short HEAD)"    >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)"     >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=%ai)"       >> $GITHUB_OUTPUT

          GITHUB_REPO_PROD="Luminous-Telecom/backnet.prod"
          LAST_COMMIT_RESPONSE=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPO_PROD}/commits/main" || echo "")

          LAST_PROD_COMMIT=$(echo "${LAST_COMMIT_RESPONSE}" | node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync(0,'utf-8'));
              const m = d?.commit?.message?.match(/Commit original: ([a-f0-9]+)/);
              console.log(m ? m[1] : (d?.sha?.substring(0,7) || ''));
            } catch {}
          " 2>/dev/null || echo "")

          if [ -z "${LAST_PROD_COMMIT}" ]; then
            LAST_PROD_COMMIT="${{ github.event.before }}"
          fi

          CURRENT_COMMIT=$(git rev-parse HEAD)
          COMMIT_LIST=$(git log "${LAST_PROD_COMMIT}..${CURRENT_COMMIT}" --pretty=format:"%H" --reverse 2>/dev/null || echo "${CURRENT_COMMIT}")

          FIRST_MESSAGE=$(git log -1 --pretty=%B | head -1)
          echo "message=${FIRST_MESSAGE}" >> $GITHUB_OUTPUT

          TEMP_FILE=$(mktemp)
          COMMIT_COUNT=0
          while IFS= read -r hash; do
            [ -n "${hash}" ] || continue
            COMMIT_COUNT=$((COMMIT_COUNT + 1))
            echo "• [$(echo ${hash} | cut -c1-7)] $(git log -1 "${hash}" --pretty=%B | head -1)" >> "${TEMP_FILE}"
          done <<< "${COMMIT_LIST}"

          if [ "${COMMIT_COUNT}" -eq 0 ]; then
            echo "• [$(git rev-parse --short HEAD)] ${FIRST_MESSAGE}" > "${TEMP_FILE}"
          fi

          echo "all_messages<<EOF" >> $GITHUB_OUTPUT
          cat "${TEMP_FILE}"       >> $GITHUB_OUTPUT
          echo "EOF"               >> $GITHUB_OUTPUT
          rm -f "${TEMP_FILE}"

      # ─────────────────────────────────────────────────────────────
      # 4. Checkout do repositório de produção
      # ─────────────────────────────────────────────────────────────
      - name: Checkout Repositório de Produção
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
        run: |
          git config --global user.name  "GitHub Actions Deploy"
          git config --global user.email "actions@github.com"
          git clone --depth 1 https://${GITHUB_TOKEN}@github.com/Luminous-Telecom/backnet.prod.git deployment

      # ─────────────────────────────────────────────────────────────
      # 5. Sincronizar artefatos via rsync (sem listas de cp)
      # ─────────────────────────────────────────────────────────────
      - name: Sincronizar Artefatos para Deploy
        run: |
          cd deployment
          mkdir -p backend frontend scripts

          # Nunca vai para produção
          rm -rf backend/src

          # ── backend/dist ─────────────────────────────────────────
          if [ -d "../backend/dist" ]; then
            rsync -a --delete ../backend/dist/ backend/dist/
            echo "✓ backend/dist sincronizado"
          else
            echo "AVISO: backend/dist não existe (build não executado, mantendo existente)"
          fi

          # ── backend: dependências e configuração ─────────────────
          rsync -a \
            ../backend/package.json \
            ../backend/package-lock.json \
            ../backend/.env.example \
            backend/

          rsync -a --delete ../backend/migrations/ backend/migrations/
          rsync -a --delete ../backend/config/     backend/config/

          for f in .sequelizerc .gitignore tsconfig.json; do
            [ -f "../backend/${f}" ] && cp "../backend/${f}" "backend/${f}"
          done

          echo "✓ Configuração do backend sincronizada"

          # ── frontend/build ────────────────────────────────────────
          # Mantém estrutura build/ — alinhado com ecosystem.config.js: serve -s build
          if [ -d "../frontend/build" ]; then
            mkdir -p frontend/build
            rsync -a --delete ../frontend/build/ frontend/build/
            [ -f "frontend/build/index.html" ] || { echo "ERRO: frontend/build/index.html ausente!"; exit 1; }
            # Cópia legada na raiz de frontend/ confunde deploy; só build/index.html deve existir no prod.
            if [ -f "frontend/index.html" ]; then
              git rm -f "frontend/index.html" 2>/dev/null || rm -f "frontend/index.html"
              echo "::notice::Removido frontend/index.html duplicado (mantém apenas frontend/build/)."
            fi
            echo "✓ frontend/build sincronizado"
          else
            echo "AVISO: frontend/build não existe (mantendo existente)"
          fi

          # ── scripts de setup da raiz ─────────────────────────────
          if [ -d "../scripts" ]; then
            rsync -a --delete ../scripts/ scripts/
            chmod +x scripts/*.sh 2>/dev/null || true
            echo "✓ scripts/ sincronizado"
          fi

          # ── arquivos raiz ─────────────────────────────────────────
          [ -f "../ecosystem.config.js" ] && cp ../ecosystem.config.js ecosystem.config.js
          [ -f "../.gitignore" ]          && cp ../.gitignore          .gitignore
          [ -f "../package.json" ]        && cp ../package.json        package.json

          echo "✓ Arquivos raiz sincronizados"

          # Remover do prod o que já não existe no fonte (cp sozinho deixa lixo no git)
          for f in docker-compose.yaml nginx.docker.conf; do
            if [ ! -f "../${f}" ] && [ -e "${f}" ]; then
              git rm -f "${f}" 2>/dev/null || rm -f "${f}"
              echo "::notice::Removido ${f} do clone prod (ausente no repositório fonte)."
            fi
          done
          if [ ! -d "../docker" ] && [ -d "docker" ]; then
            git rm -rf docker 2>/dev/null || rm -rf docker
            echo "::notice::Removida pasta docker/ do clone prod (ausente no repositório fonte)."
          fi

          echo "=== Diff frontend/build vs HEAD prod (vazio = bundle igual ao commit anterior — normal se só mudou backend/infra) ==="
          git diff --shortstat HEAD -- frontend/build/ 2>/dev/null || true

          # ── Validações essenciais ─────────────────────────────────
          [ -f "backend/package.json" ]  || { echo "ERRO: backend/package.json ausente!";  exit 1; }
          [ -f "ecosystem.config.js" ]   || { echo "ERRO: ecosystem.config.js ausente!";   exit 1; }

          echo "=== Artefatos sincronizados com sucesso ==="

      # ─────────────────────────────────────────────────────────────
      # 6. Commit e push para produção
      # ─────────────────────────────────────────────────────────────
      - name: Commit e Push para Produção
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
        run: |
          cd deployment
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"

          rm -rf backend/src

          git add -A
          git add -f backend/dist/    || true
          git add -f frontend/build/  || true
          git rm -r --cached backend/src 2>/dev/null || true

          echo "=== Status antes do commit ==="
          git status --short

          COMMIT_HASH="${{ steps.commit_info.outputs.hash }}"
          COMMIT_MSG="${{ steps.commit_info.outputs.message }}"
          ALL_MSGS="${{ steps.commit_info.outputs.all_messages }}"
          COMMIT_AUTHOR="${{ steps.commit_info.outputs.author }}"
          COMMIT_DATE="${{ steps.commit_info.outputs.date }}"
          [ -z "${COMMIT_HASH}" ]   && COMMIT_HASH="unknown"
          [ -z "${COMMIT_MSG}" ]    && COMMIT_MSG="Deploy automático"
          [ -z "${COMMIT_AUTHOR}" ] && COMMIT_AUTHOR="GitHub Actions"
          [ -z "${COMMIT_DATE}" ]   && COMMIT_DATE="$(date -Iseconds)"

          MSG_FILE=$(mktemp)
          {
            echo "Deploy: ${COMMIT_HASH} - ${COMMIT_MSG}"
            echo ""
            echo "Commits incluídos neste deploy:"
            if [ -n "${ALL_MSGS}" ]; then
              echo "${ALL_MSGS}"
            else
              echo "• [${COMMIT_HASH}] ${COMMIT_MSG}"
            fi
            echo ""
            echo "Detalhes:"
            echo "- Commit original: ${COMMIT_HASH}"
            echo "- Autor: ${COMMIT_AUTHOR}"
            echo "- Data: ${COMMIT_DATE}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Run: ${{ github.run_id }}"
          } >> "${MSG_FILE}"

          if git diff --staged --quiet; then
            git commit --allow-empty -F "${MSG_FILE}"
            echo "⚠ Commit vazio (artefatos já atualizados)"
          else
            git commit -F "${MSG_FILE}"
            echo "✓ Commit criado"
          fi
          rm -f "${MSG_FILE}"

          git remote set-url origin https://${GITHUB_TOKEN}@github.com/Luminous-Telecom/backnet.prod.git
          git fetch origin main

          if git rev-list HEAD..origin/main --count | grep -q '[1-9]'; then
            git pull origin main --no-rebase --no-edit || \
              git merge origin/main --strategy-option=ours --no-edit || \
              git merge --abort 2>/dev/null || true
          fi

          git push origin main || git push origin main --force

          echo "=== Último commit no repositório de produção ==="
          git log -1 --oneline

      # Repositório privado: diagnóstico via API (o workflow roda em backnet, não em backnet.prod).
      - name: Confirmar backnet.prod na API GitHub
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
        run: |
          REPO="Luminous-Telecom/backnet.prod"
          CODE=$(curl -sS -o /tmp/prod-repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}")
          if [ "${CODE}" != "200" ]; then
            echo "::warning::GET /repos/${REPO} retornou HTTP ${CODE}. Verifique PROD_PAT (escopo **repo**) e se o token tem acesso ao repositório prod."
            cat /tmp/prod-repo.json 2>/dev/null || true
            exit 0
          fi
          node -e "
            const fs=require('fs');
            const d=JSON.parse(fs.readFileSync('/tmp/prod-repo.json','utf8'));
            console.log('backnet.prod default_branch=', d.default_branch);
            console.log('backnet.prod pushed_at=', d.pushed_at);
            if (d.default_branch !== 'main') {
              console.log('::warning::A branch **padrão** no GitHub é \"' + d.default_branch + '\". O deploy só faz push em **main** — abra **main** no repositório prod para ver os commits de deploy.');
            }
          "
          CODE2=$(curl -sS -o /tmp/prod-commit.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/main")
          if [ "${CODE2}" != "200" ]; then
            echo "::warning::GET /commits/main retornou HTTP ${CODE2} (branch main inexistente ou sem commits?)."
            cat /tmp/prod-commit.json 2>/dev/null || true
            exit 0
          fi
          node -e "
            const c=JSON.parse(require('fs').readFileSync('/tmp/prod-commit.json','utf8'));
            const msg=(c.commit&&c.commit.message)?c.commit.message.split('\\n')[0]:'';
            console.log('Último commit em main (API):', (c.sha||'').slice(0,7), msg);
          "

      # ─────────────────────────────────────────────────────────────
      # 7. Criar Release no GitHub
      # ─────────────────────────────────────────────────────────────
      - name: Criar Release no GitHub
        if: success() && steps.build_meta.outputs.build_executed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
          VERSION_FROM_BUILD: ${{ steps.build_meta.outputs.version }}
        run: |
          cd deployment

          if [ -n "${VERSION_FROM_BUILD:-}" ]; then
            CLEAN_VERSION="${VERSION_FROM_BUILD}"
          elif [ -n "${VERSION:-}" ]; then
            CLEAN_VERSION="${VERSION}"
          elif [ -f "backend/package.json" ]; then
            CLEAN_VERSION=$(node -p "require('./backend/package.json').version.split('-')[0]")
          else
            CLEAN_VERSION="1.0.0"
          fi

          TAG_NAME="v${CLEAN_VERSION}"
          COMMIT_HASH="${{ steps.commit_info.outputs.hash }}"
          COMMIT_MSG="${{ steps.commit_info.outputs.message }}"
          ALL_MSGS="${{ steps.commit_info.outputs.all_messages }}"
          COMMIT_AUTHOR="${{ steps.commit_info.outputs.author }}"
          COMMIT_DATE="${{ steps.commit_info.outputs.date }}"
          COMMIT_HASH="${COMMIT_HASH:-unknown}"
          COMMIT_MSG="${COMMIT_MSG:-Deploy automático}"

          set -e
          # Tag pode já existir no remoto (redeploy ou versão igual à última tag).
          if git ls-remote origin "refs/tags/${TAG_NAME}" | grep -q .; then
            echo "::notice::Tag ${TAG_NAME} já existe em origin — não é necessário push."
          else
            if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
              echo "::notice::Tag ${TAG_NAME} existe só localmente — enviando ao remoto."
            else
              git tag -a "${TAG_NAME}" -m "${COMMIT_MSG}"
            fi
            git push origin "${TAG_NAME}"
          fi

          BODY_FILE=$(mktemp)
          {
            echo "${COMMIT_MSG}"
            echo ""
            echo "**Commits incluídos:**"
            echo "${ALL_MSGS:-• [${COMMIT_HASH}] ${COMMIT_MSG}}"
            echo ""
            echo "**Detalhes:**"
            echo "- Commit: ${COMMIT_HASH}"
            echo "- Autor: ${COMMIT_AUTHOR}"
            echo "- Data: ${COMMIT_DATE}"
            echo "- Workflow: ${{ github.workflow }}"
          } >> "${BODY_FILE}"

          node -e "
            const https = require('https');
            const fs = require('fs');
            const body = fs.readFileSync('${BODY_FILE}', 'utf-8');
            const token = process.env.GITHUB_TOKEN || '';
            const data = JSON.stringify({
              tag_name: '${TAG_NAME}', name: 'Release ${TAG_NAME}',
              body, draft: false, prerelease: false
            });
            const req = https.request({
              hostname: 'api.github.com',
              path: '/repos/Luminous-Telecom/backnet.prod/releases',
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + token,
                'Accept': 'application/vnd.github+json',
                'User-Agent': 'GitHub-Actions-Deploy',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(data)
              }
            }, res => {
              let raw = '';
              res.on('data', c => { raw += c; });
              res.on('end', () => {
                if (res.statusCode === 201) {
                  try { console.log('✓ Release criada:', JSON.parse(raw).html_url); }
                  catch { console.log('✓ Release criada (resposta não-JSON)'); }
                  process.exit(0);
                  return;
                }
                if (res.statusCode === 422) {
                  console.log('⚠ Release ou tag já existe (422):', raw);
                  process.exit(0);
                  return;
                }
                console.error('✗ Falha ao criar Release:', res.statusCode, raw);
                process.exit(1);
              });
            });
            req.on('error', e => { console.error(e.message); process.exit(1); });
            req.write(data);
            req.end();
          "
          rm -f "${BODY_FILE}"

      # ─────────────────────────────────────────────────────────────
      # 8. Limpeza
      # ─────────────────────────────────────────────────────────────
      - name: Limpar pastas de build
        if: always()
        run: |
          rm -rf deployment
          rm -rf backend/dist
          rm -rf frontend/build
