name: Deploy para Produção

# 1. Quando o fluxo de trabalho deve ser executado
on:
  push:
    branches:
      # Aciona o deploy sempre que houver um push na branch 'main'
      - main

# 2. Define o Job (Trabalho) de Deploy
jobs:
  deploy:
    runs-on: ubuntu-latest # O ambiente onde o código será executado

    steps:
      # Faz o checkout do código com histórico completo para comparação
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Buscar histórico completo para comparação precisa
        
      # Configura o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajuste a versão do Node conforme necessário

      # Verificar quais pastas foram alteradas
      - name: Verificar Alterações
        id: changes
        run: |
          # Obter o commit anterior (HEAD~1) ou usar o commit atual se for o primeiro
          # Usar ${{ github.event.before }} se disponível (commit anterior no push)
          PREV_COMMIT="${{ github.event.before }}"
          CURRENT_COMMIT="${{ github.sha }}"
          
          # Se não houver commit anterior no evento, tentar HEAD~1
          if [ -z "${PREV_COMMIT}" ] || [ "${PREV_COMMIT}" == "0000000000000000000000000000000000000000" ]; then
            PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          
          # Se ainda não conseguir, usar o commit atual (primeiro commit)
          if [ -z "${PREV_COMMIT}" ] || [ "${PREV_COMMIT}" == "${CURRENT_COMMIT}" ]; then
            echo "Primeiro commit ou não foi possível determinar commit anterior, buildando tudo"
            BACKEND_CHANGED="true"
            FRONTEND_CHANGED="true"
            CONFIG_CHANGED="true"
            DOCKER_CHANGED="true"
          else
            echo "Comparando commits: ${PREV_COMMIT}..${CURRENT_COMMIT}"
            
            # Listar todos os arquivos alterados
            CHANGED_FILES=$(git diff --name-only ${PREV_COMMIT} ${CURRENT_COMMIT} || echo "")
            echo "Arquivos alterados:"
            echo "${CHANGED_FILES}"
            
            # Verificar mudanças no backend
            if echo "${CHANGED_FILES}" | grep -qE '^backend/'; then
              BACKEND_CHANGED="true"
            else
              BACKEND_CHANGED="false"
            fi
            
            # Verificar mudanças no frontend
            if echo "${CHANGED_FILES}" | grep -qE '^frontend/'; then
              FRONTEND_CHANGED="true"
            else
              FRONTEND_CHANGED="false"
            fi
            
            # Verificar mudanças em arquivos de configuração/documentação na raiz
            if echo "${CHANGED_FILES}" | grep -qE '^(README\.md|docker-compose\.yaml|ecosystem\.config\.js|\.gitignore|package\.json)$'; then
              CONFIG_CHANGED="true"
            else
              CONFIG_CHANGED="false"
            fi
            
            # Verificar mudanças em arquivos Docker (Dockerfile e .dockerignore)
            if echo "${CHANGED_FILES}" | grep -qE '(Dockerfile|\.dockerignore)'; then
              DOCKER_CHANGED="true"
            else
              DOCKER_CHANGED="false"
            fi
          fi
          
          echo "backend_changed=${BACKEND_CHANGED}" >> $GITHUB_OUTPUT
          echo "frontend_changed=${FRONTEND_CHANGED}" >> $GITHUB_OUTPUT
          echo "config_changed=${CONFIG_CHANGED}" >> $GITHUB_OUTPUT
          echo "docker_changed=${DOCKER_CHANGED}" >> $GITHUB_OUTPUT
          
          echo "=== RESUMO DAS MUDANÇAS DETECTADAS ==="
          echo "Backend alterado: ${BACKEND_CHANGED}"
          echo "Frontend alterado: ${FRONTEND_CHANGED}"
          echo "Config/Docs alterado: ${CONFIG_CHANGED}"
          echo "Docker alterado: ${DOCKER_CHANGED}"
          echo ""
          echo "Commits comparados: ${PREV_COMMIT}..${CURRENT_COMMIT}"
          echo "Total de arquivos alterados: $(echo "${CHANGED_FILES}" | wc -l)"
      
      # Instala as dependências e executa o build apenas do que foi alterado
      - name: Instalar Dependências e Buildar Projeto
        run: |
          npm install
          
          # SEMPRE fazer build se não existir backend/dist ou se houver mudanças detectadas
          # Isso garante que sempre teremos artefatos para copiar
          BUILD_WAS_EXECUTED="false"
          SHOULD_BUILD="false"
          
          # Verificar se precisa fazer build
          if [ "${{ steps.changes.outputs.backend_changed }}" == "true" ] || [ "${{ steps.changes.outputs.frontend_changed }}" == "true" ]; then
            SHOULD_BUILD="true"
            echo "=== Mudanças detectadas, build necessário ==="
          elif [ ! -d "backend/dist" ] || [ ! -f "backend/dist/index.js" ]; then
            SHOULD_BUILD="true"
            echo "=== backend/dist não existe, build necessário ==="
          else
            echo "=== Nenhuma mudança detectada e backend/dist existe, verificando se precisa rebuild ==="
            # Mesmo sem mudanças detectadas, fazer build se frontend não estiver integrado
            if [ ! -d "backend/dist/frontend" ] || [ ! -f "backend/dist/frontend/index.html" ]; then
              SHOULD_BUILD="true"
              echo "=== Frontend não está integrado, build necessário ==="
            fi
          fi
          
          if [ "${SHOULD_BUILD}" == "true" ]; then
            BUILD_WAS_EXECUTED="true"
            echo "=== INICIANDO BUILD ==="
            echo "Building frontend..."
            npm ci --prefix frontend
            npm run build --prefix frontend
            
            # Verificar se frontend foi buildado
            if [ ! -d "frontend/build" ] || [ ! -f "frontend/build/index.html" ]; then
              echo "⚠ ERRO: Frontend não foi buildado corretamente!"
              exit 1
            fi
            echo "✓ Frontend buildado com sucesso"
            
            # Backend sempre precisa ser buildado se frontend ou backend mudaram
            # (pois o backend integra o frontend no build)
            echo "Building backend..."
            npm ci --prefix backend
            npm run build --prefix backend
            
            # Verificar se backend foi buildado
            if [ ! -d "backend/dist" ]; then
              echo "⚠ ERRO: Backend não foi buildado corretamente!"
              exit 1
            fi
            echo "✓ Backend buildado com sucesso"
            # Verificar se ContratoPlanoAdicional foi compilado
            if [ -f "backend/dist/models/ContratoPlanoAdicional.js" ]; then
              echo "✓ ContratoPlanoAdicional.js compilado com sucesso"
            else
              echo "⚠ AVISO: ContratoPlanoAdicional.js NÃO foi compilado!"
              echo "Arquivos em backend/dist/models/:"
              ls -la backend/dist/models/ | grep -i contrato || echo "Nenhum arquivo Contrato encontrado"
            fi
            
            # Copiar frontend buildado para backend/dist/frontend APÓS o build do backend
            # Isso garante que o frontend não seja removido durante o build
            echo "Integrando frontend buildado no backend..."
            mkdir -p backend/dist/frontend
            cp -r frontend/build/* backend/dist/frontend/
            
            # Verificar se foi copiado corretamente
            if [ -f "backend/dist/frontend/index.html" ]; then
              echo "✓ Frontend integrado com sucesso no backend"
              echo "✓ Arquivos do frontend:"
              ls -la backend/dist/frontend/ | head -10
            else
              echo "⚠ ERRO: Frontend não foi copiado corretamente!"
              exit 1
            fi
          else
            echo "✓ Build não necessário - artefatos existentes estão atualizados"
          fi
          
          # Salvar flag para uso posterior
          echo "BUILD_WAS_EXECUTED=${BUILD_WAS_EXECUTED}" >> $GITHUB_ENV
      
      # === 3. O Passo de Deployment ===
      
      # Obter informações do commit atual antes de fazer checkout do repo de produção
      - name: Obter Informações do Commit
        id: commit_info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=%ai)" >> $GITHUB_OUTPUT
      
      - name: Checkout Repositório de Produção
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
        run: |
          git config --global user.name "GitHub Actions Deploy"
          git config --global user.email "actions@github.com"
          git clone https://${GITHUB_TOKEN}@github.com/Luminous-Telecom/backnet.prod.git deployment || git clone --depth 1 https://${GITHUB_TOKEN}@github.com/Luminous-Telecom/backnet.prod.git deployment
      
      - name: Copiar Artefatos para Deploy
        run: |
          cd deployment
          
          # Debug: mostrar valores das flags
          echo "=== DEBUG: Flags de mudanças ==="
          echo "backend_changed: ${{ steps.changes.outputs.backend_changed }}"
          echo "frontend_changed: ${{ steps.changes.outputs.frontend_changed }}"
          echo "config_changed: ${{ steps.changes.outputs.config_changed }}"
          echo "docker_changed: ${{ steps.changes.outputs.docker_changed }}"
          
          # Criar estrutura de pastas se não existir
          mkdir -p backend frontend
          
          # Verificar se backend/dist existe antes de copiar
          echo "=== Verificando backend/dist antes de copiar ==="
          if [ -d "../backend/dist" ]; then
            echo "✓ backend/dist existe"
            echo "Conteúdo de backend/dist:"
            ls -la ../backend/dist/ | head -20
            if [ -d "../backend/dist/frontend" ]; then
              echo "✓ backend/dist/frontend existe"
              echo "Conteúdo de backend/dist/frontend:"
              ls -la ../backend/dist/frontend/ | head -10
            else
              echo "⚠ backend/dist/frontend NÃO existe!"
            fi
          else
            echo "⚠ ERRO: backend/dist NÃO existe!"
            echo "⚠ Isso significa que o build não foi executado ou falhou"
            echo "⚠ Verificando se BUILD_WAS_EXECUTED está definido..."
            if [ -z "${BUILD_WAS_EXECUTED}" ]; then
              echo "⚠ BUILD_WAS_EXECUTED não está definido - isso é um problema!"
            else
              echo "BUILD_WAS_EXECUTED=${BUILD_WAS_EXECUTED}"
            fi
            exit 1
          fi
          
          # Copiar artefatos do backend (frontend já está integrado no backend/dist/frontend)
          # SEMPRE copiar se backend/dist existe (mesmo sem mudanças detectadas, pode ter sido buildado)
          # Copiar se houve mudanças detectadas OU se o build foi executado OU se backend/dist existe
          if [ "${{ steps.changes.outputs.backend_changed }}" == "true" ] || [ "${{ steps.changes.outputs.frontend_changed }}" == "true" ] || [ "${BUILD_WAS_EXECUTED}" == "true" ] || [ -d "../backend/dist" ]; then
            echo "=== Copiando artefatos do backend (com frontend integrado) ==="
            rm -rf backend/dist backend/package.json backend/package-lock.json backend/env.example
            cp -r ../backend/dist backend/dist
            cp ../backend/package.json backend/package.json
            cp ../backend/package-lock.json backend/package-lock.json
            cp ../backend/env.example backend/env.example
            # Copiar arquivos fonte necessários para build (tsconfig.json e src/)
            if [ -f "../backend/tsconfig.json" ]; then
              cp ../backend/tsconfig.json backend/tsconfig.json
            fi
            if [ -d "../backend/src" ]; then
              rm -rf backend/src
              cp -r ../backend/src backend/src
            fi
            
            # Verificar se foi copiado corretamente
            echo "=== Verificando cópia ==="
            if [ -d "backend/dist" ]; then
              echo "✓ backend/dist copiado"
              if [ -d "backend/dist/frontend" ]; then
                echo "✓ backend/dist/frontend copiado"
                echo "Arquivos em backend/dist/frontend:"
                ls -la backend/dist/frontend/ | head -10
              else
                echo "⚠ ERRO: backend/dist/frontend NÃO foi copiado!"
                exit 1
              fi
              # Verificar se ContratoPlanoAdicional foi compilado
              if [ -f "backend/dist/models/ContratoPlanoAdicional.js" ]; then
                echo "✓ ContratoPlanoAdicional.js encontrado"
              else
                echo "⚠ AVISO: ContratoPlanoAdicional.js NÃO encontrado em backend/dist/models/"
                echo "Arquivos em backend/dist/models/:"
                ls -la backend/dist/models/ | grep -i contrato || echo "Nenhum arquivo Contrato encontrado"
              fi
            else
              echo "⚠ ERRO: backend/dist NÃO foi copiado!"
              exit 1
            fi
          else
            echo "⚠ Nenhuma alteração detectada (backend_changed=${{ steps.changes.outputs.backend_changed }}, frontend_changed=${{ steps.changes.outputs.frontend_changed }})"
            echo "⚠ Mantendo artefatos existentes (isso pode ser um problema se houver mudanças não detectadas)"
          fi
          
          # SEMPRE copiar arquivos necessários para migrations e configuração do Sequelize
          echo "Copiando arquivos de configuração e migrations do Sequelize..."
          
          # Criar diretório config se não existir
          mkdir -p backend/config
          
          # Copiar config/config.js (necessário para Sequelize CLI)
          if [ -f "../backend/config/config.js" ]; then
            cp ../backend/config/config.js backend/config/config.js
            echo "✓ backend/config/config.js copiado"
          else
            echo "⚠ backend/config/config.js não encontrado"
          fi
          
          # Copiar .sequelizerc (necessário para Sequelize CLI saber onde estão os arquivos)
          if [ -f "../backend/.sequelizerc" ]; then
            cp ../backend/.sequelizerc backend/.sequelizerc
            echo "✓ backend/.sequelizerc copiado"
          else
            echo "⚠ backend/.sequelizerc não encontrado"
          fi
          
          # Copiar migrations (necessário para executar migrations)
          if [ -d "../backend/migrations" ]; then
            rm -rf backend/migrations
            cp -r ../backend/migrations backend/migrations
            echo "✓ backend/migrations copiado"
          else
            echo "⚠ backend/migrations não encontrado"
          fi
          
          # Copiar build do frontend para frontend/ (se build foi executado)
          if [ "${BUILD_WAS_EXECUTED}" == "true" ] || [ -d "../frontend/build" ]; then
            echo "=== Copiando build do frontend para frontend/ ==="
            if [ -d "../frontend/build" ]; then
              # Limpar pasta frontend/ antes de copiar (exceto Dockerfiles)
              if [ -f "frontend/Dockerfile" ]; then
                cp frontend/Dockerfile frontend/Dockerfile.backup
              fi
              if [ -f "frontend/.dockerignore" ]; then
                cp frontend/.dockerignore frontend/.dockerignore.backup
              fi
              
              rm -rf frontend/*
              
              # Restaurar Dockerfiles
              if [ -f "frontend/Dockerfile.backup" ]; then
                mv frontend/Dockerfile.backup frontend/Dockerfile
              fi
              if [ -f "frontend/.dockerignore.backup" ]; then
                mv frontend/.dockerignore.backup frontend/.dockerignore
              fi
              
              # Copiar build do frontend
              cp -r ../frontend/build/* frontend/
              
              # Verificar se foi copiado
              if [ -f "frontend/index.html" ]; then
                echo "✓ Frontend build copiado para frontend/"
                echo "Arquivos em frontend/:"
                ls -la frontend/ | head -10
              else
                echo "⚠ ERRO: Frontend build não foi copiado corretamente!"
                exit 1
              fi
            else
              echo "⚠ frontend/build não existe, pulando cópia"
            fi
          else
            echo "⚠ Build não foi executado, mantendo frontend/ existente"
          fi
          
          # SEMPRE copiar arquivos Docker do backend e frontend (independente de mudanças)
          echo "Copiando arquivos Docker do backend e frontend..."
          
          # Backend Dockerfile e .dockerignore
          if [ -f "../backend/Dockerfile" ]; then
            cp ../backend/Dockerfile backend/Dockerfile
            echo "✓ backend/Dockerfile copiado"
          else
            echo "⚠ backend/Dockerfile não encontrado"
          fi
          if [ -f "../backend/.dockerignore" ]; then
            cp ../backend/.dockerignore backend/.dockerignore
            echo "✓ backend/.dockerignore copiado"
          else
            echo "⚠ backend/.dockerignore não encontrado"
          fi
          
          # Frontend Dockerfile e .dockerignore
          if [ -f "../frontend/Dockerfile" ]; then
            cp ../frontend/Dockerfile frontend/Dockerfile
            echo "✓ frontend/Dockerfile copiado"
          else
            echo "⚠ frontend/Dockerfile não encontrado"
          fi
          if [ -f "../frontend/.dockerignore" ]; then
            cp ../frontend/.dockerignore frontend/.dockerignore
            echo "✓ frontend/.dockerignore copiado"
          else
            echo "⚠ frontend/.dockerignore não encontrado"
          fi
          
          # Verificar se os arquivos foram copiados
          echo "Verificando arquivos Docker copiados:"
          ls -la backend/ | grep -E "(Dockerfile|dockerignore)" || echo "Nenhum arquivo Docker encontrado em backend/"
          ls -la frontend/ | grep -E "(Dockerfile|dockerignore)" || echo "Nenhum arquivo Docker encontrado em frontend/"
          
          # Copiar arquivos de configuração e documentação na raiz
          if [ "${{ steps.changes.outputs.config_changed }}" == "true" ]; then
            echo "Copiando arquivos de configuração e documentação..."
            
            # README.md
            if [ -f "../README.md" ]; then
              cp ../README.md README.md
              echo "README.md copiado"
            fi
            
            # docker-compose.yaml
            if [ -f "../docker-compose.yaml" ]; then
              cp ../docker-compose.yaml docker-compose.yaml
              echo "docker-compose.yaml copiado"
            fi
            
            # ecosystem.config.js
            if [ -f "../ecosystem.config.js" ]; then
              cp ../ecosystem.config.js ecosystem.config.js
              echo "ecosystem.config.js copiado"
            fi
            
            # .gitignore
            if [ -f "../.gitignore" ]; then
              cp ../.gitignore .gitignore
              echo ".gitignore copiado"
            fi
            
            # package.json da raiz (se existir)
            if [ -f "../package.json" ]; then
              cp ../package.json package.json
              echo "package.json copiado"
            fi
          else
            echo "Nenhuma alteração em arquivos de configuração/documentação"
          fi
      
      - name: Commit e Push para Produção
        env:
          GITHUB_TOKEN: ${{ secrets.PROD_PAT }}
        run: |
          cd deployment
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Adicionar todos os arquivos (incluindo não rastreados)
          git add -A
          
          # Verificar status antes do commit
          echo "=== Status do Git antes do commit ==="
          git status --short
          
          # Se BUILD_WAS_EXECUTED=true, sempre fazer commit mesmo sem mudanças detectadas
          # (porque o build foi executado e pode ter gerado novos arquivos)
          FORCE_COMMIT="false"
          if [ "${BUILD_WAS_EXECUTED}" == "true" ]; then
            FORCE_COMMIT="true"
            echo "⚠ Build foi executado, forçando commit mesmo sem mudanças detectadas"
          fi
          
          # Verificar se há mudanças para commitar
          if git diff --staged --quiet && [ "${FORCE_COMMIT}" != "true" ]; then
            echo "⚠ Nenhuma mudança detectada e build não foi executado"
            echo "⚠ Pulando commit (arquivos já estão atualizados)"
          else
            if [ "${FORCE_COMMIT}" == "true" ] && git diff --staged --quiet; then
              echo "⚠ Build foi executado mas nenhuma mudança detectada"
              echo "⚠ Fazendo commit vazio para registrar o deploy..."
              git commit --allow-empty -m "Deploy: ${{ steps.commit_info.outputs.hash }} - ${{ steps.commit_info.outputs.message }}

            Commit original: ${{ steps.commit_info.outputs.hash }}
            Autor: ${{ steps.commit_info.outputs.author }}
            Data: ${{ steps.commit_info.outputs.date }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_id }}
            Nota: Build executado mas arquivos idênticos aos existentes"
            else
              echo "✓ Mudanças detectadas, fazendo commit..."
              git commit -m "Deploy: ${{ steps.commit_info.outputs.hash }} - ${{ steps.commit_info.outputs.message }}

            Commit original: ${{ steps.commit_info.outputs.hash }}
            Autor: ${{ steps.commit_info.outputs.author }}
            Data: ${{ steps.commit_info.outputs.date }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_id }}"
            fi
            
            git remote set-url origin https://${GITHUB_TOKEN}@github.com/Luminous-Telecom/backnet.prod.git
            git push origin main
          fi
          
          # Mostrar último commit para confirmação
          echo "=== Último commit no repositório de produção ==="
          git log -1 --oneline
          
      - name: Criar Release no GitHub
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obter versão do package.json (prioridade: backend > frontend)
          if [ -f "backend/package.json" ]; then
            VERSION=$(node -p "require('./backend/package.json').version")
          elif [ -f "frontend/package.json" ]; then
            VERSION=$(node -p "require('./frontend/package.json').version")
          else
            VERSION="1.0.0"
          fi
          
          COMMIT_HASH=${{ steps.commit_info.outputs.hash }}
          COMMIT_MESSAGE="${{ steps.commit_info.outputs.message }}"
          TAG_NAME="v${VERSION}-${COMMIT_HASH}"
          
          # Criar tag e push
          git tag -a "${TAG_NAME}" -m "${COMMIT_MESSAGE}" 2>/dev/null || echo "Tag já existe"
          git push origin "${TAG_NAME}" 2>/dev/null || echo "Tag já existe no remoto"
          
          # Criar release usando API do GitHub
          RELEASE_BODY="${COMMIT_MESSAGE}

          **Detalhes:**
          - Commit: ${COMMIT_HASH}
          - Autor: ${{ steps.commit_info.outputs.author }}
          - Data: ${{ steps.commit_info.outputs.date }}
          - Workflow: ${{ github.workflow }}"
          
          # Criar release via API usando Node.js para escapar JSON corretamente
          node -e "
            const https = require('https');
            const data = JSON.stringify({
              tag_name: '${TAG_NAME}',
              name: 'Release ${TAG_NAME}',
              body: \`${RELEASE_BODY}\`,
              draft: false,
              prerelease: false
            });
            
            const options = {
              hostname: 'api.github.com',
              path: '/repos/${{ github.repository }}/releases',
              method: 'POST',
              headers: {
                'Authorization': 'token ${GITHUB_TOKEN}',
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
                'Content-Length': data.length
              }
            };
            
            const req = https.request(options, (res) => {
              if (res.statusCode === 201) {
                console.log('Release criada com sucesso');
              } else {
                console.log('Release já existe ou erro:', res.statusCode);
              }
            });
            
            req.on('error', (e) => {
              console.log('Erro ao criar release:', e.message);
            });
            
            req.write(data);
            req.end();
          " || echo "Erro ao criar release"
      
      - name: Limpar pastas de build
        run: |
          rm -rf deployment
          
          if [ "${{ steps.changes.outputs.backend_changed }}" == "true" ]; then
            rm -rf backend/dist
          fi
          
          if [ "${{ steps.changes.outputs.frontend_changed }}" == "true" ]; then
            rm -rf frontend/build
          fi