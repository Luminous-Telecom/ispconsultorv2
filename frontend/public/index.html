<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          var isSystem = /^\/(adm|saas)(\/|$)|^\/login$/.test(p);
          var key = isSystem ? 'theme-system' : 'theme-site';
          var t = localStorage.getItem(key) || localStorage.getItem('theme');
          var theme = (t === 'light' || t === 'dark') ? t : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) { /* noop */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BackNet" />
    <meta
      name="description"
      content=""
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="%PUBLIC_URL%/android-chrome-192x192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title></title>
  </head>
  <body>
    <script>
      (function(){try{var p=window.location.pathname;document.body.setAttribute('data-app',/^\/(adm|saas)(\/|$)|^\/login$/.test(p)?'system':'site');}catch(e){}})();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
