<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          // Evita "flash" da favicon do sistema no site público.
          // No site (rota "/") usamos a logo da empresa; no sistema, mantém a favicon fixa.
          var isPublicHome = window.location.pathname === '/' || window.location.pathname === '';
          var href = isPublicHome ? '/api/dados-empresa/logo' : '/favicon.ico';

          var link = document.createElement('link');
          link.rel = 'icon';
          link.type = 'image/x-icon';
          link.href = href;
          document.head.appendChild(link);
        } catch (e) {
          // noop
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Sistema para Assessoria Técnica em Provedores de Internet"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>BackNet</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
