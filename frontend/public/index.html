<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          var isSystem = /^\/(adm|saas)(\/|$)|^\/login$/.test(p);
          var key = isSystem ? 'theme-system' : 'theme-site';
          var t = localStorage.getItem(key) || localStorage.getItem('theme');
          var theme = (t === 'light' || t === 'dark') ? t : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) { /* noop */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ISP Consultor" />
    <meta
      name="description"
      content=""
    />
    <title></title>
  </head>
  <body>
    <script>
      (function(){try{var p=window.location.pathname;document.body.setAttribute('data-app',/^\/(adm|saas)(\/|$)|^\/login$/.test(p)?'system':'site');}catch(e){}})();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
