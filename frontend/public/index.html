<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          // Evita "flash" da favicon do sistema no site público.
          // No site (rota "/") usamos a logo da empresa; no sistema, mantém a favicon fixa.
          var isPublicHome = window.location.pathname === '/' || window.location.pathname === '';
          var href = isPublicHome ? '/api/dados-empresa/logo' : '/favicon.ico';

          var link = document.createElement('link');
          link.rel = 'icon';
          link.type = 'image/x-icon';
          link.href = href;
          document.head.appendChild(link);
        } catch (e) {
          // noop
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var theme = (t === 'light' || t === 'dark') ? t : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) { /* noop */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content=""
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title></title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
