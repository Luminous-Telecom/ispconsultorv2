# nginx-version: 1
# Gerenciado automaticamente pelo sistema de atualização.
# Altere a versão acima ao modificar este arquivo para que a atualização seja aplicada automaticamente.

upstream backend {
    server localhost:3001;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name backnet.app;

    access_log /var/log/nginx/backnet-access.log;
    error_log /var/log/nginx/backnet-error.log;

    client_max_body_size 100M;

    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location /api {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /webhook {
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    location /boleto {
        proxy_pass http://backend;
    }

    location /arquivos/ {
        proxy_pass http://backend;
    }

    location ~ ^/(health|client-ip) {
        proxy_pass http://backend;
    }

    location / {
        root /opt/backnet.prod/frontend;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        }
    }
}
