# Em desenvolvimento: backend e frontend rodam no host (npm/pm2).
# Docker sobe só nginx, db, redis e elasticsearch.
# Para usar variáveis do backend: docker-compose --env-file backend/.env up -d
# Ou crie .env na raiz do projeto com as mesmas variáveis.

services:
  nginx:
    image: nginx:alpine
    container_name: backnet-nginx
    env_file:
      - backend/.env
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mysql:8.0
    container_name: backnet-mysql
    restart: always
    env_file:
      - backend/.env
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-backnet}
      MYSQL_USER: ${DB_USER:-backnet}
      MYSQL_PASSWORD: ${DB_PASSWORD:-amine}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: backnet-redis
    restart: always
    env_file:
      - backend/.env
    command: ["sh", "-c", "exec redis-server $$([ -n \"$$REDIS_PASSWORD\" ] && echo \"--requirepass $$REDIS_PASSWORD\")"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli $$([ -n \"$$REDIS_PASSWORD\" ] && echo \"-a $$REDIS_PASSWORD\") ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: backnet-elasticsearch
    env_file:
      - backend/.env
    deploy:
      resources:
        limits:
          memory: 1536M
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
  elasticsearch_data:
